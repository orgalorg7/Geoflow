[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow-geospatial-core"
version = "0.1.0"
description = "Provider-neutral raster processing engine for GeoFlow"
requires-python = ">=3.11"
dependencies = [
  "affine>=2.4,<3",
  "numpy>=2,<2.5",
  "pillow>=11,<13",
  "rasterio>=1.4,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
